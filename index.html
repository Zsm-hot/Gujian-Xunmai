<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>古建寻脉：八方营造录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 1. 清除默认边距，防止出现滚动条 */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #d4cfc4; /* 这里用你游戏画布的颜色 */
      }

      /* 2. 让游戏容器铺满整个屏幕并居中 */
      /* 2. 让游戏容器铺满整个屏幕并居中 */
      #app {
        width: 100vw;
        height: 100vh; /* 强制占满整个视口高度 */
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #d4cfc4;
      }

      /* 3. 竖屏时的旋转提示层（默认隐藏） */
      #rotate-prompt {
        display: none; 
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #d4cfc4;
        z-index: 9999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Noto Serif SC', serif; /* 使用你引入的古风字体 */
        color: #4a453f;
      }

      /* 4. 媒体查询：当设备处于竖屏时，强制显示提示 */
      @media (orientation: portrait) {
        #rotate-prompt {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <!-- 游戏容器 -->
    <div id="app"></div>
    
    <!-- 手机竖屏提示遮罩 -->
    <div id="rotate-prompt">
      <div style="font-size: 60px; margin-bottom: 20px;">📱 ↻</div>
      <div style="font-size: 24px; font-weight: bold;">请旋转手机至横屏游玩</div>
      <div style="font-size: 14px; margin-top: 10px; color: #7d6354;">为了更好的古建探索体验</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
